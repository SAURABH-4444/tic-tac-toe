<!DOCTYPE html>
<html lang="en">
<head>
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <center>

        <h1>Tic Tac Toe</h1>

        <div id="game">
            <div id="box">

                <div class="cell" id="c1" onclick="playerClick('c1')"></div>
                <div class="cell" id="c2" onclick="playerClick('c2')"></div>
                <div class="cell" id="c3" onclick="playerClick('c3')"></div>

                <div class="cell" id="c4" onclick="playerClick('c4')"></div>
                <div class="cell" id="c5" onclick="playerClick('c5')"></div>
                <div class="cell" id="c6" onclick="playerClick('c6')"></div>

                <div class="cell" id="c7" onclick="playerClick('c7')"></div>
                <div class="cell" id="c8" onclick="playerClick('c8')"></div>
                <div class="cell" id="c9" onclick="playerClick('c9')"></div>

            </div>
        </div>

        <br><br>

        <h1 id="result"></h1>

        <button onclick="window.location='index.html'">Restart</button>

    </center>

    <script src="script.js"></script>
</body>
</html>
